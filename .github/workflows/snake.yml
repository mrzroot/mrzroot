name: Generate Contribution Snake Animation

on:
  schedule:
    # Run every 24 hours at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Snake Animation SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake-custom.svg?color_snake=#00D2FF&color_dots=#0d1117,#013a63,#014f86,#2a6f97,#00D2FF
            dist/snake-turquoise-dark.svg?color_snake=#e8b04b&color_dots=#121a33,#0f4a4f,#16807d,#25b3ab,#3fd0c9&color_background=#070b1a
            dist/snake-turquoise-light.svg?color_snake=#b7801f&color_dots=#ece8dc,#bfe9e5,#7fd6cf,#2fb8af,#0a7671&color_background=#f7f5ef

      - name: Deploy SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
