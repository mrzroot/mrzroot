name: Generate Contribution Snake Animation

on:
  schedule:
    # Run every 24 hours at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Snake Animation SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake-custom.svg?color_snake=#00D2FF&color_dots=#0d1117,#013a63,#014f86,#2a6f97,#00D2FF
            dist/snake-teal-dark.svg?color_snake=#4ae8bd&color_dots=#161b22,#0e3b30,#11604b,#1f9c78,#4ae8bd&color_background=#0d1117
            dist/snake-teal-light.svg?color_snake=#078a68&color_dots=#ebedf0,#c5f2e4,#8be3c9,#3cc79d,#078a68&color_background=#ffffff

      - name: Deploy SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
